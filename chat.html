<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120713">
<title>Deepu & Me ❤️</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<div id="hearts"></div>
<div class="app">
<section id="authScreen" class="card">
<div class="logo">❤️</div><div class="eyebrow">PRIVATE LITTLE CORNER</div>
<h1>Deepu & Me</h1><p>A place for just our conversations.</p>
<div class="tabs"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Create account</button></div>
<form id="authForm" class="auth-form">
<input id="email" type="email" placeholder="Email address" autocomplete="email" required>
<input id="password" type="password" placeholder="Password" autocomplete="current-password" minlength="6" required>
<button id="authButton" class="primary" type="submit">Login ❤️</button>
</form><div id="authMessage"></div>
</section>
<section id="chatScreen" class="chat hidden">
<header class="chat-header"><div class="avatar">D</div><div class="header-info"><b>Deepu ❤️</b><span id="status">Private chat</span>

</div><button id="logoutBtn" class="logout" type="button">
    🚪 Logout
</button>

</header>
<div id="messages" class="messages"><div id="empty" class="empty"><div class="big">💌</div><b>Start your little conversation</b><span>Send the first message ❤️</span></div></div>
<button id="scrollBottom" class="scroll-bottom hidden" type="button">↓ New messages</button>
<div id="typing" class="typing hidden">Deepu is typing…</div>
<form id="messageForm" class="composer">
<button id="emojiBtn" class="emoji-btn" type="button">😊</button>
<input id="message" maxlength="1000" placeholder="Write something to Deepu..." autocomplete="off">
<button class="send-btn" type="submit">➤</button>
<div id="emojiPanel" class="emoji-panel hidden">
<button type="button">❤️</button><button type="button">💕</button><button type="button">🥰</button><button type="button">😘</button><button type="button">😂</button><button type="button">😍</button>
<button type="button">🥺</button><button type="button">😌</button><button type="button">✨</button><button type="button">🌹</button><button type="button">🫶</button><button type="button">💖</button>
</div></form>
</section>
</div>
<script type="module" src="chat.js"></script>
</body>
</html>
