<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deepu & Me ❤️</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<div id="hearts"></div>
<main>
<section id="authScreen" class="card auth">
  <div class="heart-logo">❤️</div>
  <small>PRIVATE LITTLE CORNER</small>
  <h1>Deepu & Me</h1>
  <p>A place for just our conversations.</p>
  <div class="tabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Create account</button></div>
  <form id="authForm">
    <input id="email" type="email" placeholder="Email address" required>
    <input id="password" type="password" placeholder="Password" minlength="6" required>
    <button id="authButton" class="primary">Login ❤️</button>
  </form>
  <div id="authMessage"></div>
</section>

<section id="chatScreen" class="chat hidden">
<header>
  <div class="avatar">D</div>
  <div><b>Deepu ❤️</b><span id="status">Private chat</span></div>
  <button id="logout">↪</button>
</header>
<div id="messages"><div id="empty" class="empty">💌<b>Start your little conversation</b><span>Send the first message ❤️</span></div></div>
<form id="messageForm" class="composer">
  <button type="button" id="emoji">😊</button>
  <input id="message" maxlength="1000" placeholder="Write something to Deepu..." autocomplete="off">
  <button class="send">➤</button>
</form>
<div id="emojiPanel" class="emoji hidden">
  <button>❤️</button><button>💕</button><button>🥰</button><button>😘</button><button>😂</button><button>😍</button>
  <button>🥺</button><button>😌</button><button>✨</button><button>🌹</button><button>🫶</button><button>💖</button>
</div>
</section>
</main>
<script type="module" src="chat.js"></script>
</body>
</html>
